<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenWrt Firmware Builder</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="index.css" />
    <script src="config.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- header across the whole page -->
    <header>
      <div>
        <a href="https://openwrt.org">
          <img src="logo.svg" width="180" alt="Logo" />
        </a>
        <div style="flex-grow: 1"></div>
        <div>
          <select id="languages-select">
            <option value="en">English</option>
            <option value="es">Español (Spanish)</option>
          </select>
          <button id="languages-button"></button>
        </div>
      </div>
    </header>

    <div id="alert" class="hide"></div>

    <div class="container">
      <div>
        <h2>Build Custom OpenWrt Firmware</h2>
        <p>Configure your firmware below and request a custom build.</p>

        <div class="form-group">
          <label for="device" class="form-label">Device</label>
          <select id="device" class="form-select"></select>
        </div>

        <div class="form-group">
          <label for="root-password" class="form-label">Root Password</label>
          <input type="text" id="root-password" class="form-input" placeholder="openwrteslinux" />
        </div>

        <div class="form-group">
          <label for="wifi-name" class="form-label">Wi-Fi Name (SSID)</label>
          <input type="text" id="wifi-name" class="form-input" placeholder="MyWiFi" />
        </div>

        <div class="form-group">
          <label for="wifi-encryption" class="form-label">Wi-Fi Encryption</label>
          <select id="wifi-encryption" class="form-select">
            <option value="wpa2">WPA2</option>
            <option value="open">Open</option>
            <option value="owe">Enhanced Open</option>
          </select>
        </div>

        <div class="form-group" id="wifi-password-group">
          <label for="wifi-password" class="form-label">Wi-Fi Password (min 8 chars)</label>
          <input type="text" id="wifi-password" class="form-input" placeholder="12345678" />
        </div>

        <div class="form-group">
          <label for="channel-2ghz" class="form-label">2.4 GHz Channel</label>
          <select id="channel-2ghz" class="form-select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11" selected>11</option>
            <option value="12">12</option>
            <option value="13">13</option>
          </select>
        </div>

        <div class="form-group">
          <label for="channel-5ghz" class="form-label">5 GHz Channel</label>
          <select id="channel-5ghz" class="form-select">
            <option value="36">36</option>
            <option value="40">40</option>
            <option value="44">44</option>
            <option value="48">48</option>
            <option value="149" selected>149</option>
            <option value="153">153</option>
            <option value="157">157</option>
            <option value="161">161</option>
            <option value="165">165</option>
          </select>
        </div>

        <div id="asu-buildstatus" class="hide">
          <span></span>
          <div id="asu-log" class="hide">
            <details>
              <summary><code>STDERR</code></summary>
              <pre id="asu-stderr"></pre>
            </details>
            <details>
              <summary><code>STDOUT</code></summary>
              <pre id="asu-stdout"></pre>
            </details>
          </div>
        </div>

        <a href="#" id="asu-request-build" class="build-link">
          <span></span><span>BUILD FIRMWARE</span>
        </a>

        <!-- Download / images section (shown after build) -->
        <div id="notfound" class="hide"><h3 class="tr-notfound"></h3></div>
        <div id="images" class="hide">
          <div id="downloads1">
            <h3 class="tr-downloads"></h3>
            <table><tbody id="download-table1"></tbody></table>
          </div>
          <div id="download-links2"></div>
          <div id="download-extras2"></div>

          <div class="row">
            <div class="col1 tr-model"></div>
            <div class="col2" id="image-model"></div>
          </div>
          <div class="row">
            <div class="col1 tr-target"></div>
            <div class="col2" id="image-target"></div>
          </div>
          <div class="row">
            <div class="col1 tr-version-label"></div>
            <div class="col2" id="image-version"></div>
          </div>
          <div class="row">
            <div class="col1 tr-version-code"></div>
            <div class="col2" id="image-code"></div>
          </div>
          <div class="row">
            <div class="col1 tr-build-date"></div>
            <div class="col2" id="image-date"></div>
          </div>
          <div class="row">
            <a href="#" target="_blank" id="image-info" class="col1"></a>
            <div class="col2" id="image-folder"></div>
          </div>
          <input id="image-link" type="hidden" />
          <details id="asu">
            <summary><span class="tr-customizeasu"></span></summary>
            <div class="layout">
              <table>
                <tr>
                  <td>
                    <label for="asu-packages" class="tr-extra-packages"></label>
                  </td>
                  <td>
                    <textarea id="asu-packages" class="asu-packages"></textarea>
                  </td>
                </tr>
              </table>
            </div>
          </details>
        </div>
        <input id="models" type="hidden" />
      </div>
    </div>
  </body>
</html>
